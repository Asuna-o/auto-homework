name: Build WhaleGirl V1.2.1 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WhaleGirl V1.2.1 build branch
        uses: actions/checkout@v4
        with:
          repository: Asuna-o/pidforge
          ref: whalegirl-v121-build

      - name: Reconstruct V0.8 baseline sources
        shell: bash
        run: |
          cat whalegirl/v08_parts/MainActivity.*.part > whalegirl/app/src/main/java/com/whalegirl/pet/MainActivity.java
          cat whalegirl/v08_parts/PetOverlayService.java.b64.*.part | base64 -d | gunzip > whalegirl/app/src/main/java/com/whalegirl/pet/PetOverlayService.java
          base64 -d whalegirl/v06_parts/ReminderReceiver.java.gz.b64 | gunzip > whalegirl/app/src/main/java/com/whalegirl/pet/ReminderReceiver.java

      - name: Apply V0.9 animation patch
        shell: bash
        run: |
          base64 -d whalegirl/v09_patch.gz.b64 | gunzip > /tmp/v09.patch
          cd whalegirl
          patch -p1 < /tmp/v09.patch

      - name: Apply V1.0 product patch
        shell: bash
        run: |
          base64 -d whalegirl/v10_parts/v10.patch.gz.b64 | gunzip > /tmp/v10.patch
          cd whalegirl
          patch -p1 < /tmp/v10.patch

      - name: Apply V1.1 stability and reminders patch
        shell: bash
        run: |
          base64 -d whalegirl/v11_parts/v11.patch.gz.b64 | gunzip > /tmp/v11.patch
          cd whalegirl
          patch -p1 < /tmp/v11.patch

      - name: Apply V1.2 safe-area layout patch
        shell: bash
        run: |
          base64 -d whalegirl/v12_parts/v12.patch.gz.b64 | gunzip > /tmp/v12.patch
          cd whalegirl
          patch -p1 < /tmp/v12.patch

      - name: Restore intact WhaleGirl render assets
        shell: bash
        run: |
          base64 -d whalegirl/v121_parts/whale_girl.png.b64 > whalegirl/app/src/main/res/drawable-nodpi/whale_girl.png
          base64 -d whalegirl/v121_parts/whale_girl_blink.png.b64 > whalegirl/app/src/main/res/drawable-nodpi/whale_girl_blink.png
          sed -i 's/versionCode = 12/versionCode = 13/' whalegirl/app/build.gradle.kts
          sed -i 's/versionName = "1.2.0"/versionName = "1.2.1"/' whalegirl/app/build.gradle.kts
          python3 - <<'PY'
          import os, struct
          for p in ['whalegirl/app/src/main/res/drawable-nodpi/whale_girl.png','whalegirl/app/src/main/res/drawable-nodpi/whale_girl_blink.png']:
              b=open(p,'rb').read()
              assert b[:8] == b'\x89PNG\r\n\x1a\n', p
              w,h=struct.unpack('>II', b[16:24])
              assert (w,h)==(112,149), (p,w,h)
              assert len(b)>4000, (p,len(b))
              print(p, w, h, len(b))
          PY

      - name: Install stable V1.0+ test signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 -d whalegirl/v10_parts/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: whalegirl
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhaleGirl-V1.2.1-render-fix-apk
          path: whalegirl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reconstructed V1.2.1 source
        uses: actions/upload-artifact@v4
        with:
          name: WhaleGirl-V1.2.1-source
          path: whalegirl
          if-no-files-found: error
