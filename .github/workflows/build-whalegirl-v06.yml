name: Build WhaleGirl V0.9 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WhaleGirl V0.9 build branch
        uses: actions/checkout@v4
        with:
          repository: Asuna-o/pidforge
          ref: whalegirl-v09-build

      - name: Reconstruct V0.8 baseline sources
        shell: bash
        run: |
          cat whalegirl/v08_parts/MainActivity.*.part > whalegirl/app/src/main/java/com/whalegirl/pet/MainActivity.java
          cat whalegirl/v08_parts/PetOverlayService.java.b64.*.part | base64 -d | gunzip > whalegirl/app/src/main/java/com/whalegirl/pet/PetOverlayService.java
          base64 -d whalegirl/v06_parts/ReminderReceiver.java.gz.b64 | gunzip > whalegirl/app/src/main/java/com/whalegirl/pet/ReminderReceiver.java

      - name: Apply V0.9 animation patch
        shell: bash
        run: |
          base64 -d whalegirl/v09_patch.gz.b64 | gunzip > /tmp/v09.patch
          cd whalegirl
          patch -p1 < /tmp/v09.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: whalegirl
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhaleGirl-V0.9-debug-apk
          path: whalegirl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reconstructed V0.9 source
        uses: actions/upload-artifact@v4
        with:
          name: WhaleGirl-V0.9-source
          path: whalegirl
          if-no-files-found: error
